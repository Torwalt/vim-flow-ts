<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111714" />
    <title>vim-flow</title>
    <link rel="stylesheet" href="./src/web/style.css" />
    <script type="module" src="./src/web/main.ts"></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">VIM-FLOW / 001</p>
        <h1>A place for your muscle memory.</h1>
        <p class="intro">A free game for people who miss moving at the speed of thought.</p>
      </header>
      <section class="viewport" aria-label="Game viewport">
        <div class="tabline"><span>world</span><span>40 × 20</span></div>
        <canvas id="world" aria-label="An empty glyph field surrounded by a stone border"></canvas>
        <div class="statusline"><span>READY</span><span>an empty field, for now</span></div>
      </section>
      <footer><span>TypeScript × Bun</span><span>Gameplay begins in the next iteration.</span></footer>
    </main>
  </body>
</html>

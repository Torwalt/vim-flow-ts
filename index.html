<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111714" />
    <title>vim-flow</title>
    <link rel="stylesheet" href="./src/web/style.css" />
    <script type="module" src="./src/web/main.ts"></script>
  </head>
  <body>
    <main id="game">
      <canvas
        id="world"
        tabindex="0"
        aria-label="A full-window ASCII world with a navigation cursor"
      ></canvas>
      <section id="survival-overlay" aria-label="Survival status">
        <section id="survival-prompt" aria-label="Current prompt">
          <span id="survival-prompt-title"></span>
          <span id="survival-prompt-text"></span>
          <span id="survival-notice"></span>
        </section>
        <section id="survival-status" aria-label="Survival information">
          <span id="survival-status-hp"></span>
          <span id="survival-status-wave"></span>
          <span id="survival-status-kills"></span>
          <span id="survival-status-pop"></span>
          <span id="survival-status-rally"></span>
          <span id="survival-status-source"></span>
          <span id="survival-status-clock"></span>
          <span id="survival-status-legend"></span>
          <span id="survival-status-hint">i rally Enter</span>
        </section>
      </section>
      <aside id="hud" aria-label="Game status">
        <span id="hud-site" class="hud-site">no site</span>
        <span id="hud-resources" class="hud-resources"></span>
        <span id="hud-mode" class="hud-mode">NORMAL</span>
        <span id="hud-hp" class="hud-hp">HP —</span>
        <span id="hud-wave" class="hud-wave">wave —</span>
        <span id="hud-kills" class="hud-kills">kills —</span>
        <span id="hud-pop" class="hud-pop">allies — · enemies —</span>
        <span id="hud-cursor" class="hud-cursor">13,10 · 0,0</span>
        <span id="hud-source" class="hud-source">source —</span>
        <span id="hud-rally" class="hud-rally">rally —</span>
        <span id="hud-draft" class="hud-draft">draft —</span>
        <span id="hud-notice" class="hud-notice"></span>
        <span id="hud-legend" class="hud-legend"></span>
        <span id="hud-clock" class="hud-clock">0.0s · running</span>
      </aside>
    </main>
  </body>
</html>
